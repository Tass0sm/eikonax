[project]
name = "eikonax"
version = "0.1.0"
description = "JAX-based numerical solvers for eikonal and Hamilton-Jacobi-Bellman equations"
authors = [{ name = "Tassos Manganaris", email = "tassos.manganaris@gmail.com" }]
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "optax>=0.2",
    # The generic splat regression model the `huygens` strategy is built on.
    "srms",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# CUDA JAX: `uv sync --extra gpu` (Linux only).
gpu = ["jax[cuda12]>=0.4.30; sys_platform == 'linux'"]

[project.scripts]
eikonax-solve = "eikonax.scripts.solve:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
srms = { path = "../../research/17-subriemannian-ntfields/splat-regression-modeling", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eikonax"]
